name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test and build Windows x64
        shell: pwsh
        run: |
          $version = (Get-Content mygo.json -Raw | ConvertFrom-Json).version
          ./scripts/build-mygo.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: Lux-windows-x64
          path: dist/Lux-*-mygo-windows-x64/windows-amd64/Lux.exe
          if-no-files-found: error
