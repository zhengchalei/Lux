[package]
name = "lux"
version = "0.1.0"
edition = "2024"
description = "A native Windows League of Legends match and champion selection assistant"
license = "MIT"

[features]
diagnostics = ["dep:gpui-pre", "gpui-pre/profiler"]

[dependencies]
gpui-kit = "=0.9.1"
gpui-pre = { version = "=0.3.12", default-features = false, optional = true }
anyhow = "1"
async-channel = "2"
base64 = "0.22"
chrono = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
native-tls = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "net"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "native-tls"] }

[profile.dev]
debug = 0

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
